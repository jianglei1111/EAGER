[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "eager-rag"
version = "0.1.0"
description = "EAGER evidence construction for multi-hop question answering"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3",
]

[project.optional-dependencies]
core = [
  "faiss-cpu>=1.13,<1.14",
  "numpy>=2.2,<2.3",
  "openai>=2.28,<3",
  "pandas>=2.3,<2.4",
  "pyarrow>=23,<24",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.14,<4",
  "requests>=2.32,<3",
  "sentence-transformers>=5.3,<5.4",
  "sentencepiece>=0.2,<0.3",
  "spacy>=3.8,<3.9",
  "tqdm>=4.67,<5",
  "transformers==4.51.3",
]
dev = [
  "packaging==25.0",
  "pytest==9.0.2",
  "tomli==2.4.0; python_version < '3.11'",
]

[project.scripts]
eager = "eager.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["eager", "eager.*", "eager_baselines"]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "integration: offline integration tests",
  "model: tests requiring a local model snapshot",
  "network: opt-in tests requiring network access",
]
